name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: tg_export
            archive: tg_export_linux_amd64.tar.gz
          - goos: windows
            goarch: amd64
            binary: tg_export.exe
            archive: tg_export_windows_amd64.zip
          - goos: darwin
            goarch: arm64
            binary: tg_export
            archive: tg_export_darwin_arm64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.binary }}" .

      - name: Archive (tar.gz)
        if: matrix.goos != 'windows'
        run: tar czf "${{ matrix.archive }}" "${{ matrix.binary }}" README.md

      - name: Archive (zip)
        if: matrix.goos == 'windows'
        run: zip -q "${{ matrix.archive }}" "${{ matrix.binary }}" README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
